# ===== EasyFrp 配置模板 =====
# 复制为 ~/.config/easyfrp/config.toml 并填写

# frps 服务器（公网入口）。工具靠它 ssh 管理各 frpc 机器、探测已占用端口。
[frps]
host = "你的公网IP"            # frps 服务器公网地址
ssh_port = 22                  # frps 所在机器的 ssh 端口
user = "root"                  # ssh 用户名
key = "~/.ssh/id_rsa"          # ssh 私钥路径
port_range = [10000, 20000]    # frps 的 allowPorts 范围

# 访问命令模板（列表里按编号回车时执行）
# 占位符：{host} {port} {name} {desc} {key} {user}
[commands]
tcp   = "open http://{host}:{port}"
http  = "open http://{host}:{port}"
https = "open https://{host}:{port}"
udp   = ""

# 按映射名单独定制访问命令（可选，优先于上面的按类型）
[commands.names]
# ssh-xxx   = "ssh -p {port} -i {key} {user}@{host}"
# mysql-xxx = "mysql -h {host} -P {port} -u root -p"

# 各 frpc 内网机器。
# 每台先用 install-frpc.sh 装好，脚本会打印对应的 [[machines]] 片段，粘贴到这里即可。
[[machines]]
name = "示例机器"
ssh_port = 10040               # 这台机器 ssh 经 frps 转发的远程端口
proxies_dir = "/opt/easyfrp/proxies"
frpc_toml = "/opt/easyfrp/frpc.toml"

# 已有手动部署的机器可单独指定路径 / 账号 / 重启命令
# [[machines]]
# name = "106"
# ssh_port = 10022
# proxies_dir = "/www/server/frp/proxies"
# frpc_toml = "/www/server/frp/frpc.toml"
# user = "root"                 # 可选，覆盖 frps.user
# key = "~/.ssh/id_rsa"         # 可选，覆盖 frps.key
# restart_cmd = "nohup sh -c 'sleep 1; systemctl restart frpc' >/dev/null 2>&1 &"